name: Privacy site (GitHub Pages)

# Publishes site/ (privacy policy + landing page) so Google Play has a public privacy-policy URL.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions". See docs/PLAY-STORE.md, step 3.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site (no dependencies needed)
        run: node scripts/make-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
