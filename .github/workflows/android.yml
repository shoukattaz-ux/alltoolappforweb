name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships an Android SDK ($ANDROID_HOME). Use it directly rather than a setup action:
      # make sure the licenses are accepted and the platform/build-tools this project targets are present.
      - name: Prepare the Android SDK
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager: $SDKM"
          # sudo uses root's own HOME so it cannot leave root-owned files in the runner's home (Gradle needs
          # ~/.config/.android to be writable to create the debug keystore).
          yes | sudo env HOME=/root "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          for pkg in "platforms;android-36" "build-tools;36.0.0"; do
            if [ -d "$ANDROID_HOME/$(echo "$pkg" | tr ';' '/')" ]; then echo "already installed: $pkg"
            else sudo env HOME=/root "JAVA_HOME=$JAVA_HOME" "$SDKM" "$pkg"; fi
          done
          mkdir -p "$HOME/.config/.android" "$HOME/.android"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config" "$HOME/.android"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build the web app and sync it into the Android project
        run: npm run android:sync

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check the APK requests no permissions (no network access)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q "INTERNET" permissions.txt; then echo "::error::The APK requests INTERNET; the privacy promise requires none."; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: toolhaven-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
